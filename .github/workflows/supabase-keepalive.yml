name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (comfortably inside the 7-day pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query login_events to generate real DB activity
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/login_events?select=id&order=logged_in_at.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")

          echo "HTTP status: $response"
          cat /tmp/response.json
          echo ""

          if [ "$response" -ne 200 ]; then
            echo "::error::Keep-alive query failed with status $response"
            exit 1
          fi

          echo "Keep-alive query succeeded."
